name: Build precompiled NIFs and create a release

on:
  push:
    branches:
      - main
    tags:
      - "*"

jobs:
  # The single place the project version is read, and the gate on the tag that
  # carries it. `PdfElixide.Native` builds its `base_url` as
  # `<repo>/releases/download/v#{version}` (lib/pdf_elixide/native.ex), so a
  # release tagged anything but `v<mix version>` publishes archives that
  # `rustler_precompiled` will never look for. The check lives inside the step
  # rather than in a job-level `if:` because a skipped job skips everything that
  # `needs:` it, which would skip the whole build matrix on a push to main.
  verify_tag:
    name: Verify the tag matches the project version
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.project-version.outputs.version }}
    steps:
      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Extract project version
        id: project-version
        shell: bash
        run: |
          # Get the project version from mix.exs
          version="$(sed -n 's/^  @version "\(.*\)"/\1/p' mix.exs | head -n1)"
          echo "version=$version" >> "$GITHUB_OUTPUT"

          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match the mix.exs version $version. \
          The NIFs would be published under this tag while consumers download them from \
          releases/download/v$version. Retag as v$version, or bump mix.exs."
            exit 1
          fi

  build_release:
    name: NIF ${{ matrix.nif }} - ${{ matrix.job.target }} (${{ matrix.job.os }})
    needs: verify_tag
    runs-on: ${{ matrix.job.os }}
    permissions:
      # For creating a new release.
      contents: write
      # The following are needed for the "actions/attest" GH Action.
      id-token: write
      attestations: write
      artifact-metadata: write
    strategy:
      fail-fast: false
      matrix:
        nif: ["2.15"]
        job:
          - {
              target: arm-unknown-linux-gnueabihf,
              os: ubuntu-22.04,
              use-cross: true,
            }
          - {
              target: aarch64-unknown-linux-gnu,
              os: ubuntu-22.04,
              use-cross: true,
            }
          - {
              target: aarch64-unknown-linux-musl,
              os: ubuntu-22.04,
              use-cross: true,
            }
          - { target: aarch64-apple-darwin, os: macos-15 }
          - {
              target: riscv64gc-unknown-linux-gnu,
              os: ubuntu-22.04,
              use-cross: true,
            }
          - { target: x86_64-apple-darwin, os: macos-15-intel }
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-22.04 }
          - {
              target: x86_64-unknown-linux-musl,
              os: ubuntu-22.04,
              use-cross: true,
            }
          - { target: x86_64-pc-windows-gnu, os: windows-2022 }
          - { target: x86_64-pc-windows-msvc, os: windows-2022 }

    steps:
      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          target: ${{ matrix.job.target }}

      - name: Build the project
        id: build-crate
        env:
          # Force Cargo to write artifacts under the NIF crate dir instead of the
          # workspace root, so philss/rustler-precompiled-action finds the binary at
          # `<project-dir>/target/<triple>/release/`.
          CARGO_TARGET_DIR: target
        uses: philss/rustler-precompiled-action@v1.1.5
        with:
          project-name: pdf_elixide_nif
          project-version: ${{ needs.verify_tag.outputs.version }}
          target: ${{ matrix.job.target }}
          nif-version: ${{ matrix.nif }}
          use-cross: ${{ matrix.job.use-cross }}
          project-dir: "native/pdf_elixide_nif"

      - uses: actions/attest@v4
        with:
          subject-path: ${{ steps.build-crate.outputs.file-path }}

      - name: Artifact upload
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.build-crate.outputs.file-name }}
          path: ${{ steps.build-crate.outputs.file-path }}

      - name: Publish archives and packages
        uses: softprops/action-gh-release@v3
        with:
          files: |
            ${{ steps.build-crate.outputs.file-path }}
        if: startsWith(github.ref, 'refs/tags/')
