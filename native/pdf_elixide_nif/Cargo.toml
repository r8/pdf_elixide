[package]
name = "pdf_elixide_nif"
version = "0.20.0"
authors = ["Sergey Storchay"]
edition = "2021"
description = "Rust NIF for pdf_elixide — Elixir bindings to pdf_oxide via Rustler."
repository = "https://github.com/r8/pdf_elixide"
license = "MIT"
readme = "../../README.md"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
# Keep CMS/DER aligned with `pdf_oxide`; `alloc`/`oid` expose the ASN.1 APIs used here.
cms = "0.3.0-pre.1"
der = { version = "0.8", features = ["alloc", "oid"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
log = "0.4"
# Keep aligned with the version `pdf_oxide` resolves; used only to detect a package's format.
office_oxide = { version = "=0.1.11", default-features = false }
pdf_oxide = { version = "=0.3.78", features = ["signatures", "rendering"] }
rustler = "0.37.4"
# RFC 3161 message-imprint hashing.
sha1 = "0.11"
sha2 = "0.11"
