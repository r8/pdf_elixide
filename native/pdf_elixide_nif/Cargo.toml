[package]
name = "pdf_elixide_nif"
version = "0.24.0"
authors = ["Sergey Storchay"]
edition = "2021"
description = "Rust NIF for pdf_elixide — Elixir bindings to pdf_oxide via Rustler."
repository = "https://github.com/r8/pdf_elixide"
license = "MIT"
readme = "../../README.md"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
# Keep barcode encoder versions aligned with `pdf_oxide`'s lock file.
barcoders = { version = "=2.0.0", default-features = false, features = ["std"] }
# Keep the PKCS#12 stack aligned with what `pdf_oxide` resolves.
cbc = { version = "0.2", features = ["alloc", "block-padding"] }
# Keep CMS/DER aligned with `pdf_oxide`; `alloc`/`oid` expose the ASN.1 APIs used here,
# `pem` the certificate block decoder.
cms = "0.3.0-pre.1"
der = { version = "0.8", features = ["alloc", "oid", "pem"] }
des = "0.9"
hmac = "0.13"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
log = "0.4"
# Keep aligned with the version `pdf_oxide` resolves; used only to detect a package's format.
office_oxide = { version = "=0.1.11", default-features = false }
pdf_oxide = { version = "=0.3.78", features = ["signatures", "rendering"] }
pkcs12 = { version = "=0.2.0-pre.0", features = ["kdf"] }
pkcs5 = { version = "0.8", features = ["alloc", "pbes2"] }
qrcode = { version = "=0.14.1", default-features = false }
rc2 = "0.9"
rustler = "0.37.4"
# Keep aligned with the version `pdf_oxide` resolves; reads a font's PostScript name.
ttf-parser = "0.25"
# RFC 3161 message-imprint hashing.
sha1 = "0.11"
sha2 = "0.11"
# Bidi classes, so right-to-left text the layout cannot order is refused.
unicode-bidi = "0.3"
unicode-normalization = "0.1"
# General categories, so spacing vowel signs the layout cannot place are refused.
unicode-properties = { version = "0.1", default-features = false, features = ["general-category"] }
# Grapheme clusters, so a word split across lines never separates a cluster.
unicode-segmentation = "1.13"

[dev-dependencies]
# Builds the stores used by the certificate tests.
p12-keystore = "=0.3.1"
