[package]
name = "pdf_elixide_nif"
version = "0.17.0"
authors = ["Sergey Storchay"]
edition = "2021"
description = "Rust NIF for pdf_elixide — Elixir bindings to pdf_oxide via Rustler."
repository = "https://github.com/r8/pdf_elixide"
license = "MIT"
readme = "../../README.md"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
# Match `pdf_oxide` so Cargo unifies the CMS and DER dependency graph.
cms = "0.2"
der = "0.7"
image = { version = "0.25", default-features = false, features = ["jpeg"] }
log = "0.4"
pdf_oxide = { version = "0.3.77", features = ["signatures", "jpeg2000"] }
rustler = "0.37.4"
# RFC 3161 message-imprint hashing.
sha1 = "0.11"
sha2 = "0.11"
